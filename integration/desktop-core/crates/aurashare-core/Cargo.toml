[package]
name = "aurashare-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.7.3", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
http = "1"
if-addrs = "0.13"
mdns-sd = "0.11"
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
rcgen = "0.13.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = { version = "0.18", features = ["verify"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tempfile = "3"
tokio-stream = "0.1"
tower = "0.5"
